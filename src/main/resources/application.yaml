spring:
  application:
    name: risk-data-processing-platform

  datasource:
    url: jdbc:postgresql://localhost:5433/risk_db
    username: risk_user
    password: risk_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

server:
  port: 8081

risk:
  batch:
    input:
      path: input/trades.csv
    restart-test:
      enabled: false
      trade-id: TRD009

reference-data:
  service:
    base-url: http://localhost:8082